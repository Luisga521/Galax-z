name: Bug
description: The app or the tools do something wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thank you for looking. This is a work in progress, and others may answer first.
  - type: input
    id: where
    attributes: { label: Where, placeholder: "iPad / iPhone / Mac app, version; USB or Bluetooth; or a tool" }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What happens, and what you expected }
    validations: { required: true }
  - type: checkboxes
    id: demo
    attributes:
      label: Checked
      options:
        - label: TE's app and other copies of Galax-z were closed
        - label: I looked in docs/KNOWN-ISSUES.md and docs/STATUS.md
        - label: It happens with the demo OP-Z too (leave empty if not)
